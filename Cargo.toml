[package]
name = "tidalfast"
default-run = "tidalfast"
version = "1.1.1-alpha.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A fast native TIDAL client"
repository = "https://github.com/CIoudGuy/tidalfast"
keywords = ["tidal", "music", "egui", "player"]
categories = ["multimedia::audio"]

[lib]
name = "tidalfast"
path = "src/lib.rs"

[[bin]]
name = "tidalfast"
path = "src/tidalfast.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
directories = "6"
# One protected-store API, with only each target's native provider below.
# Durable TIDAL grants must not be copied into ordinary state JSON.
keyring-core = "1"
# The whole UI. glow keeps the binary and the dependency tree small; wgpu is
# not needed for a 2D music client.
# AccessKit connects egui's control names, states, and actions to native screen readers.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg"] }
# The shared foundation of Tidalfast, ZapFast, RekordFlash and TonePush
# (crmne/fastframe). Every crate comes from the same revision; move them
# together.
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# Colour emoji in the platform's own style (Apple Color Emoji, Segoe UI
# Emoji, the desktop's colour emoji font), in every text through its egui
# plugin.
fastframe-emoji = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# Catalogs compiled from PO files at build time (see build.rs) and the
# system's preferred languages. No libintl or runtime catalog parsing.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# The log file for bug reports and the panic log (env_logger underneath).
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# The tray item, so closing the window can keep the music playing:
# StatusNotifier on Linux, the notification area on Windows, the menu bar
# on macOS.
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# Keeps the app running without a window around eframe::run_native.
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# The macOS title-bar double-click setting (does nothing elsewhere).
fastframe-macos = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# Self-update from GitHub releases, on the reqwest client below.
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1", features = ["reqwest"] }
# Settings, the session, the history, caches and the credential markers
# are replaced whole: a temporary file beside each, synced to the disk, then
# moved over it (written through on Windows), so a crash never leaves half.
fastframe-file = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# The device's power, session and network state: energy saver, battery,
# display, lock, the internet's reach and cost, sleep and wake, and the App
# Nap activity local playback holds on macOS.
fastframe-power = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# The audio device stream: it pauses, so a paused player costs no CPU (#636),
# follows the default output and reopens after a failure.
fastframe-audio = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# The wheel step, the Linux touchpad scale and glide, and the axis a scroll
# gesture holds.
fastframe-scroll = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# One running copy per user: a lock and a private channel that a second
# launch and the command line hand their requests to.
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# The desktop's media controls: MPRIS on Linux, the media overlay on
# Windows, Now Playing on macOS. The media keys and those panels send
# commands back, and closing the window keeps the music playing.
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# webp is for cover URLs: TIDAL's CDN sometimes serves the same cover as
# WebP, and without this every size of it fails to decode and the
# placeholder is drawn. gif is for Luna plugin images (oneko's sprite
# sheet, GIF stickers); the first frame is drawn.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# The Luna runtime's zlib module (src/luna/runtime.rs). Already compiled for
# reqwest's gzip support, so this adds no code to the build.
flate2 = "1"
# Drawing the taskbar thumbnail buttons' icons (src/thumbbar.rs). Already
# compiled for the SVG icons through egui_extras and resvg, so this adds no
# code to the build.
tiny-skia = "0.11"
# Glyph outlines for Luna plugins' canvas text (src/luna/canvas.rs). Already
# compiled for egui's text, so this adds no code to the build.
skrifa = "0.44"
# Unpacks the WOFF and WOFF2 fonts plugins and themes name in `@font-face`
# (src/ui/plugin_dom.rs), the web's font formats, which egui cannot read.
# Pure Rust; flate2 is already in the tree, brotli-decompressor is new.
wuff = "0.2"
# Maps the bold cut of an installed script font (src/fonts.rs), as
# fastframe-fonts maps the regular one. Already in the tree at this version.
memmap2 = "0.9"
# Detect the live window backend. eframe already compiles this crate.
raw-window-handle = "0.6"
# Local playback's audio sink is this crate's own (src/sink.rs). rodio
# supplies the mixer and the queue only; fastframe-audio below owns the
# device stream.
rodio = { version = "0.21", default-features = false }
# Decodes TIDAL streams for the local engine (src/tidal_engine/): FLAC, and
# AAC or FLAC in MP4 (single files and DASH segments). `wav` is the decoder tests' fixture format.
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "aac", "isomp4", "alac", "pcm", "wav"] }
# Decodes the AAC of TIDAL's Low and High (src/tidal_engine/decode.rs).
# symphonia's AAC decoder is AAC-LC only: it plays HE-AAC, TIDAL's Low, as
# its core at half the rate without the SBR band above 11 kHz. Pure Rust,
# no dependencies, Apache-2.0, and HE-AAC v1/v2 decode within 1 LSB of
# ffmpeg on the ISO conformance streams. Without default features it builds
# with no SIMD `unsafe`. symphonia's own `aac` above still decodes music
# videos' sound (src/tidal_engine/video.rs).
rusty_aac = { version = "1.1", default-features = false }
# `socks` is SOCKS5 proxy support for the Web API, artwork, lyrics, and
# update checks. HTTP proxies work without it. `system-proxy` reads the OS
# proxy on macOS and Windows when the mode is System; Linux uses environment
# variables either way.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "blocking", "socks", "system-proxy"] }
# `fs` is used by the playlist cache in `backend.rs`. On Linux the MPRIS
# dependency happens to turn it on, which is why leaving it out built
# there and nowhere else. `net` is the local HTTP-proxy tests.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }
sha1 = "0.10"
sha2 = "0.10"
# Ed25519 signatures on update manifests (already built for fastframe-update).
ring = "0.17"
# MD5 for the Luna runtime's crypto shim (`src/luna/`).
md-5 = "0.10"
base64 = "0.22"
rand = "0.9"
open = "5"
# The system's open and save dialogs for Luna plugins (Electron's
# `dialog.showSaveDialog`, src/plugins/luna_host.rs): Win32 and Cocoa
# natively, the desktop portal (or zenity) on Linux. `default-features =
# false` leaves out the Wayland parent-window code; the dialog then has no
# parent window, which the portal accepts.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
percent-encoding = "2"
urlencoding = "2"
# Reads the MPEG-DASH manifests TIDAL sends for FLAC-in-MP4 streams
# (`api/tidal/manifest.rs`). Small, no dependencies, already in the tree.
roxmltree = "0.20"
# CSS colours in plugin and theme CSS beyond hex, rgb() and hsl(): the 148
# named colours, hwb(), lab(), lch(), oklab(), oklch(), color() and relative
# colours, with the colour-space conversions color-mix() needs to mix in a
# space other than sRGB (`ui/plugin_slots.rs` `css::color`). Tested against
# Chromium's and Firefox's colour cases. About 80 KB; it brings only phf (its
# name table) and uncased.
csscolorparser = "0.9"
jiff = "0.2"
unicode-bidi = "0.3"
hmac = "0.12"
# The Luna compatibility runtime (`src/luna/`) runs unmodified TidaLuna
# plugins (ES modules) without a browser: QuickJS is a small embeddable
# JavaScript engine with ES modules, top-level await, an interrupt handler
# (runaway-plugin watchdog) and a memory limit. `loader` resolves the
# `@luna/*`/React imports to our shim modules.
rquickjs = { version = "0.14", features = ["loader"] }
# The `WebAssembly` global for Luna plugins (src/luna/wasm.rs): bundled
# libraries such as undici's HTTP parser ship as WebAssembly, which QuickJS
# does not run. wasmi is a pure-Rust interpreter: no JIT and no executable
# memory, so it builds the same on every target, and its fuel metering and
# resource limiter let the runtime stop a runaway module (watchdog) and cap
# each plugin's linear memory. Its `wat` text parser is left out, and it
# runs on its loop dispatcher (`portable-dispatch`): the default tail-call
# dispatcher depends on LLVM turning every handler call into a jump, which
# Windows x64 did not do, so a long-running module overflowed the stack.
# `simd` is the fixed-width 128-bit SIMD Chromium runs: undici's llhttp
# ships a SIMD build that is tried first (DiscordRPC).
wasmi = { version = "2", default-features = false, features = ["stable", "std", "validate", "portable-dispatch", "simd"] }
# wasmi's own core crate (already in the tree through wasmi), for the error
# type its `ResourceLimiter` trait returns, which wasmi does not re-export.
wasmi_core = "2"
# Luna plugins' `<video>` clips are VP9 in WebM (CatJam's dancing cat,
# with its alpha channel as a second VP9 stream): src/luna/video.rs reads
# the WebM itself and decodes each clip once with this pure-Rust VP9
# decoder. No codec ships with the system on Linux, and Media Foundation
# needs an optional Store extension for VP9 on Windows, so the app carries
# one. No C, no build script, no dependencies, Apache-2.0, bit-exact on
# libvpx's conformance vectors. Its decoder is single-threaded, so a clip
# decodes on the one low-priority thread video.rs gives it (the encoder
# half of the crate is never called and is left out of the binary).
rusty_vp9 = "0.1.2"
# WHATWG URL parsing for the runtime's `URL` global and fetch. Already in the
# tree through reqwest.
url = "2"
# Matrix products for the depth model a Luna plugin runs through its
# transformers.js calls (src/luna/onnx_run.rs: @visiuun/3d-cover's
# Depth-Anything-V2). Pure Rust SGEMM with run-time SIMD dispatch and one
# tiny dependency (rawpointer); it keeps a cover at about a second where plain
# loops take many. A full ONNX runtime (tract, ort) would add 18 MB or a
# native library for one plugin, so the few operators the model needs are
# Tidalfast's own.
matrixmultiply = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# The application menus and Dock menu (src/mac_menu.rs). "exception" lets
# src/mac_touchbar_crash_guard.rs catch a specific AppKit Objective-C
# exception instead of letting it abort the process. NSWorkspace and
# NSAccessibility answer whether the user asked for less motion
# (src/motion.rs).
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSWindow", "NSView", "NSScreen", "NSColor", "NSImage", "NSImageView", "NSButton", "NSControl", "NSTrackingArea", "NSVisualEffectView", "NSTextField", "NSBezierPath", "NSFont", "NSAnimation", "NSAnimationContext", "NSWorkspace"] }
# NSAppleEventManager and NSAppleEventDescriptor carry the TIDAL links
# macOS hands an app registered for the scheme (src/mac_links.rs), and
# NSRunLoop has the delayed perform the title bar uses (src/window.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString", "NSThread", "NSDictionary", "NSAttributedString", "NSData"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }
# Message loops, the taskbar thumbnail buttons and window styles.
# Win32_Storage_FileSystem: GetDiskFreeSpaceExW, the free space of the disk
# the downloads fill (src/diskspace.rs); same crate, no new dependency.
# Win32_Graphics_Dwm: DwmGetWindowAttribute, whether the windows above the
# main one are cloaked and where their frames are (src/occlusion), which
# tells a fully covered window to stop animating; same crate.
# Win32_UI_Input_KeyboardAndMouse: RegisterHotKey, the system-wide shortcuts
# a Luna plugin may hold once the user allows it (src/luna/hotkeys.rs).
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# WASAPI exclusive mode for the bit-perfect output
# (src/tidal_engine/exclusive/wasapi.rs): cpal, under fastframe-audio, only
# opens shared-mode streams. cpal already compiles this version with these
# features (plus Win32_System_Com), so it adds no crate to the build.
# Win32_Media_MediaFoundation: the animated covers' H.264 decoder
# (src/video_cover.rs), the system's own; with Win32_Graphics_Direct3D11
# (and Direct3D, Dxgi for its types) it decodes, converts and scales on the
# GPU. Features of the same crate, no new dependency.
# Win32_Media_Audio_Endpoints: the bit-perfect output moves the device's
# own hardware volume (IAudioEndpointVolume); same crate, no new dependency.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Devices_Properties", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Media", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_MediaFoundation", "Win32_Media_Multimedia", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Reuses the zbus/Tokio stack already used for desktop integration.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
# The session bus, for the desktop's light or dark preference
# (src/appearance.rs). fastframe-now-playing's MPRIS already compiles this
# version.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Whether the session is GNOME, and its window button layout and icon theme
# read through the desktop portal (src/window.rs), which works inside a
# Flatpak, where running gsettings does not.
fastframe-desktop = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1" }
# Bit-perfect output: the sound card's own `hw:` device, past the sound
# server. Already in the tree under cpal.
alsa = "0.11"

[target.'cfg(not(windows))'.dependencies]
# The animated covers' H.264 decoder on Linux and macOS (src/video_cover.rs;
# Windows uses Media Foundation). OpenH264 is NOT compiled into the app:
# H.264's patent royalties are covered only for Cisco's own prebuilt
# binaries, so the app loads Cisco's library at run time (a system or
# Flatpak-extension copy, or Cisco's binary downloaded once from
# ciscobinary.openh264.org into the cache and accepted only when its SHA-256
# matches one of Cisco's builds), like Firefox. `libloading` (with no
# `source`) builds only the bindings; -sys is named for its `API` trait.
# bzip2 unpacks Cisco's download (its default backend is pure Rust).
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
openh264-sys2 = { version = "0.9", default-features = false, features = ["libloading"] }
bzip2 = "0.6"
# statvfs: the free space of the disk the downloads fill (src/diskspace.rs).
# Already in the tree under std and tokio, so it adds no crate to the build.
libc = "0.2"

[build-dependencies]
# Drops unfinished PO entries and compiles catalog text and gettext plural
# expressions to Rust. Ordinary builds do not need gettext tools.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.5.1", features = ["build"] }

[dev-dependencies]
# Checks that every catalog covers the template and keeps its placeholders.
polib = "0.3"
# Run connection-deadline regressions with a virtual clock.
tokio = { version = "1", features = ["test-util"] }
# Compiles the WebAssembly text fixtures of the Luna `WebAssembly` tests.
wat = "1"

# The icon and version information Windows shows for the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Sample data and screenshot flags; never part of a release build.
demo = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Audio decoding and immediate-mode layout are too slow at opt-level 0 to
# audition the app in development. Keep every dependency optimized while the
# application crate itself stays incremental.
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# CIoudGuy/egui, branch tidalfast: the owner's fork of crmne/egui apps-0.36.2
# (6ce633ba), the branch ZapFast, RekordFlash and TonePush share. That branch
# is egui 0.36.2 (among its fixes: egui's busy-loop fix, emilk/egui#8398,
# Sense::drag and DragValue fixes, and transparent child viewports on Windows
# with glow, emilk/egui#8423) with right-to-left runs shaped in their bidi
# direction and digits shaped left to right in text without right-to-left
# letters (emilk/egui#8577), eframe pacing Wayland frames by the compositor's
# frame callbacks so a window the compositor stops showing never blocks in a
# vsync swap (emilk/egui#8631, #266), each emoji cluster laid out one emoji
# wide, egui's clipboard sharing its Wayland data device with winit's file
# drops (#614), accesskit focus on a widget drawn a frame later
# (emilk/egui#8621), a compatibility profile when a core GL context fails
# (emilk/egui#8655), and the zoom factor saved with the window size so a
# zoomed window keeps its size (emilk/egui#8656). The fork adds what
# see-through plugin windows need: ViewportBuilder options that leave out
# the border, rounded corners and shadow Windows 11 draws around a frameless
# window, and eframe's NativeOptions::transparent_viewports, a GL config with
# alpha so that see-through child windows also work on X11 and macOS. It
# also makes frames cheaper and text closer to TIDAL's: on Windows eframe
# makes the GL context current only when another window's surface is
# (emilk/egui#4173), egui_glow uploads a frame's meshes in one buffer upload
# each, and FontColorTransferFunction::PerColor adjusts glyph coverage per
# text colour in egui_glow's shader, as Chromium's Skia does. Every egui
# crate comes from the same revision so they share one emath and epaint.
# Move to crmne/egui again once it carries these changes.
ecolor = { git = "https://github.com/CIoudGuy/egui", rev = "36760640cdc3db4614c5b3c530cc93f8ea06aa48" }
eframe = { git = "https://github.com/CIoudGuy/egui", rev = "36760640cdc3db4614c5b3c530cc93f8ea06aa48" }
egui = { git = "https://github.com/CIoudGuy/egui", rev = "36760640cdc3db4614c5b3c530cc93f8ea06aa48" }
egui-wgpu = { git = "https://github.com/CIoudGuy/egui", rev = "36760640cdc3db4614c5b3c530cc93f8ea06aa48" }
egui-winit = { git = "https://github.com/CIoudGuy/egui", rev = "36760640cdc3db4614c5b3c530cc93f8ea06aa48" }
egui_extras = { git = "https://github.com/CIoudGuy/egui", rev = "36760640cdc3db4614c5b3c530cc93f8ea06aa48" }
egui_glow = { git = "https://github.com/CIoudGuy/egui", rev = "36760640cdc3db4614c5b3c530cc93f8ea06aa48" }
emath = { git = "https://github.com/CIoudGuy/egui", rev = "36760640cdc3db4614c5b3c530cc93f8ea06aa48" }
epaint = { git = "https://github.com/CIoudGuy/egui", rev = "36760640cdc3db4614c5b3c530cc93f8ea06aa48" }
epaint_default_fonts = { git = "https://github.com/CIoudGuy/egui", rev = "36760640cdc3db4614c5b3c530cc93f8ea06aa48" }
# crmne/winit apps-0.30, shared with the same apps: winit 0.30.13 plus Wayland
# `Occluded` for the xdg-shell suspended state with commits on the app's behalf
# while it isn't presenting (rust-windowing/winit#4709, #4710), macOS Quit
# through close requests behind a feature Tidalfast leaves off (winit#4692),
# a macOS window ordered out and flushed before it closes, so a Touch Bar
# cannot leave a ghost window behind (winit#4728), and file drag and drop on Wayland through the one data device egui's
# clipboard also uses, since Hyprland gives the clipboard and drags only to an
# app's first data device (#614). eframe from the fork above calls the
# Occluded API and shares that device. Move both forks together with the
# other apps.
winit = { git = "https://github.com/crmne/winit", rev = "ed7caa9023f10b397f5b6ec8284a840cbd8a6f65" }
