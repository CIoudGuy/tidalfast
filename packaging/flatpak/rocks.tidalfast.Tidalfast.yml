# Tidalfast as a Flatpak, built from source: the manifest Flathub builds
# from. The copy in the Flathub repository names a tag and its commit in
# the source below and carries cargo-sources.json next to it; flathub.sh
# writes both. For a local build, this one takes the checkout as it is:
#
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/rocks.tidalfast.Tidalfast.yml
#
# The release workflow does not build from source twice: it packages the
# binary the Linux job already built, through the bundle manifest beside
# this one, whose finish-args are the same as these.
id: rocks.tidalfast.Tidalfast
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: tidalfast
finish-args:
  # Wayland first, X11 when that is what there is.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Sound: PulseAudio, which PipeWire also answers.
  - --socket=pulseaudio
  # Bit-perfect output opens the sound card's ALSA hw device under
  # /dev/snd, which Flatpak only exposes with all devices, and asks the
  # sound server to release the card over the session bus
  # (org.freedesktop.ReserveDevice1, as JACK does).
  - --device=all
  - --own-name=org.freedesktop.ReserveDevice1.*
  - --talk-name=org.freedesktop.ReserveDevice1.*
  # TIDAL's API, streaming, sign-in and Luna plugin downloads.
  - --share=network
  # Platform storage for this application's TIDAL grants.
  - --talk-name=org.freedesktop.secrets
  # The tray item, and media keys and Now Playing over MPRIS.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.tidalfast
  # Discord Rich Presence: Discord's IPC sockets in the runtime directory,
  # from a native, Flatpak (Discord, Discord Canary, Vesktop) or Snap
  # Discord.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/discord-ipc-1
  - --filesystem=xdg-run/discord-ipc-2
  - --filesystem=xdg-run/discord-ipc-3
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=xdg-run/app/com.discordapp.DiscordCanary:create
  - --filesystem=xdg-run/.flatpak/dev.vencord.Vesktop:create
  - --filesystem=xdg-run/snap.discord:create
  # Older Flatpak versions leave XDG_STATE_HOME unset. Keep the fallback
  # state directory (session, history, logs, and credential markers) durable.
  - --persist=.local/state
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/tidalfast/cargo
modules:
  - name: tidalfast
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked
      - install -Dm755 target/release/tidalfast /app/bin/tidalfast
      - install -Dm644 packaging/applications/*.desktop /app/share/applications/rocks.tidalfast.Tidalfast.desktop
      - sed -i 's/^Icon=.*$/Icon=rocks.tidalfast.Tidalfast/;s/^StartupWMClass=tidalfast$/StartupWMClass=rocks.tidalfast.Tidalfast/' /app/share/applications/rocks.tidalfast.Tidalfast.desktop
      - install -Dm644 packaging/icons/*.svg /app/share/icons/hicolor/scalable/apps/rocks.tidalfast.Tidalfast.svg
      - install -Dm644 packaging/flatpak/rocks.tidalfast.Tidalfast.metainfo.xml /app/share/metainfo/rocks.tidalfast.Tidalfast.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/tidalfast/LICENSE
    sources:
      - type: dir
        path: ../..
      # Supply the current app ID even when generating a manifest for an older tag.
      - type: file
        path: rocks.tidalfast.Tidalfast.metainfo.xml
        dest: packaging/flatpak
      # Every crate the lockfile names, for the offline build; flathub.sh
      # writes it with flatpak-cargo-generator.
      - cargo-sources.json
